# Reachability assessments — MANUAL INPUT, human-verified.
#
# Deliberately NOT scraped. LinkedIn's terms prohibit automated collection, and
# demoing a scraper to a company that sells into SEBI/RBI/IRDAI-regulated
# buyers would be arguing against our own compliance story. Each entry below is
# a judgement a human made and can defend.
#
# FIELDS
#   leadership_publicly_active : bool | null
#       Is there a NAMED CX / support-ops / digital leader posting publicly in
#       the last 90 days? null = not yet checked. Fill this in by hand.
#   warm_path_exists : bool | null
#       Shared investor, shared vendor, existing Eternal/Zomato commercial
#       relationship, or a reference-able Nugget customer in the same vertical.
#   company_size_band : startup | mid | large | enterprise
#       Public, uncontroversial. Pre-filled.
#   assessed_by / assessed_on : provenance, so a stale judgement is visible.
#
# A null field is EXCLUDED from the score and reduces confidence. It is not
# treated as a middling value. Leaving it null is the honest default.

prospects:

