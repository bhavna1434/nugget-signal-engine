# Nugget Signal Engine — Prospect Universe
#
# Indian BFSI companies mapped to Nugget's published industry verticals.
# Vertical names match https://www.nugget.com/industries/* exactly.
#
# RULE: static fields below are identity/classification only (name, vertical,
# android package, regulator). NO performance, complaint, or rating numbers are
# hard-coded here. Those are populated by collectors at runtime into
# data/signals.json. If a collector cannot reach a source, the field stays null
# and the confidence score degrades. We never guess.
#
# EXCLUSIONS: the author's current employer is deliberately absent from this
# list. Including an employer in a prospecting list built for a third party is
# a conflict of interest. See README "Conflicts & data hygiene".

meta:
  version: "0.1"
  compiled: "2026-10-20"
  universe_note: >
    Selection criteria: (1) India-domiciled, (2) consumer-facing at scale, so
    support volume is material, (3) operates in a vertical Nugget already
    publishes a landing page for, (4) regulated by SEBI / RBI / IRDAI, so
    compliance-grade conversation logging is a buying requirement rather than
    a nice-to-have.

